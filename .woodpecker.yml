# Woodpecker 的执行模型：每个 step 就是一个独立的 Docker 容器。
#   image    —— agent 会 docker pull 这个镜像，然后起一个容器
#   commands —— 在该容器内依次执行（自动拼成一个 shell 脚本）
#   工作目录 —— 仓库代码克隆到 /woodpecker/src/... 并挂载进每个容器，
#               所以上一个 step 产生的文件，下一个 step 能直接看到
#   容器退出码非 0 即判定失败，后续 step 不再执行

steps:
  # ---- 默认构建：push / PR / 手动触发都走这里 ----
  - name: build
    image: node:16-alpine
    commands:
      - yarn install --frozen-lockfile
      - yarn build
      - ls -lh dist/
    when:
      - event: manual

  # ---- tag 构建：打了版本 tag 才跑，产出正式 dist ----
  - name: release-build
    image: node:16-alpine
    commands:
      - echo "开始发布 ${CI_COMMIT_TAG}"
      - yarn install --frozen-lockfile
      - yarn build
      - ls -lh dist/
    when:
      - event: tag

  # ---- 打 Docker 镜像并推送：同样只在 tag 时执行 ----
  # 这个 step 不写 commands，而是用官方插件。插件本身也是个容器，
  # settings 下的字段会以 PLUGIN_XXX 环境变量传给它。
  - name: docker-publish
    image: woodpeckerci/plugin-docker-buildx
    settings:
      repo: bluto-man/vue-cropperjs
      dockerfile: Dockerfile
      platforms: linux/amd64
      tags:
        - ${CI_COMMIT_TAG}
        - latest
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password
    when:
      - event: tag

# Woodpecker 的执行模型：每个 step 就是一个独立的 Docker 容器。
#   image    —— agent 会 docker pull 这个镜像，然后起一个容器
#   commands —— 在该容器内依次执行（自动拼成一个 shell 脚本）
#   工作目录 —— 仓库代码克隆到 /woodpecker/src/... 并挂载进每个容器，
#               所以上一个 step 产生的文件，下一个 step 能直接看到
#   容器退出码非 0 即判定失败，后续 step 不再执行
#
# 构建逻辑全部收在 Dockerfile 里，这里不再单独跑一遍 yarn install / yarn build。
# 之前是 CI step 编一次、Dockerfile 阶段 1 又原样编一次，白跑一遍；
# 而且 .dockerignore 排除了 dist，Dockerfile 也看不到 CI 的产物，想复用都复用不了。
# 只留 docker 一个入口，好处是本地 docker build 和 CI 跑的是同一套逻辑。
#
# ⚠️ 启用推送前必须先填两个地方，见文件末尾的「待填清单」。
#    在填完之前，打 tag 会让 docker-push 这一步失败。

# 顶层 when 是整条流水线的开关，管的是「这条流水线该不该存在」；
# 写在 step 里的 when 只管「这个 step 跑不跑」，流水线本身照样成立。
# 想让普通 push 完全不进 Woodpecker，就得写在顶层。
when:
  - event: [manual, tag]

steps:
  # ---- 手动触发：只验证能不能构建出来，不推送 ----
  # 改了 Dockerfile 或依赖之后先点 Run pipeline 跑这个，确认没问题再打 tag。
  #
  # privileged 是必须的：插件内部要自己起一个 docker daemon 才能 buildx，
  # 非特权容器起不来。对应地，仓库需要在 Woodpecker 里被标记为 trusted。
  #
  # dry_run 让插件跳过 login 和 push，所以这一步不需要任何凭据。
  - name: docker-build
    image: woodpeckerci/plugin-docker-buildx
    privileged: true
    settings:
      dry_run: true
      repo: bluto-man/vue-cropperjs
      dockerfile: Dockerfile
      # 不要写 platforms —— 当前 agent 是 linux/arm64（MacBook）。
      # 指定 linux/amd64 会让 buildx 用 QEMU 模拟 x86 来跑 yarn install 和
      # webpack 打包，每条指令都要翻译，速度掉一个数量级（十几分钟起步）。
      tags:
        - latest
    when:
      - event: manual

  # ---- 打 tag：构建并推送到私有 registry ----
  # username / password 走 Woodpecker 的 secret，不要写进这个文件。
  # from_secret 里的名字要和仓库设置 → 秘密 里创建的名称完全一致。
  - name: docker-push
    image: woodpeckerci/plugin-docker-buildx
    privileged: true
    settings:
      # ↓↓↓ 待填 1：registry 地址，不带 https:// 前缀，例：registry.lan:5000
      registry: REGISTRY_HOST
      # ↓↓↓ 待填 2：完整镜像名必须以 registry 地址开头，
      #             否则插件会把镜像推去 docker.io
      repo: REGISTRY_HOST/bluto-man/vue-cropperjs
      dockerfile: Dockerfile
      username:
        from_secret: registry_username
      password:
        from_secret: registry_password
      # registry 走 http 而不是 https 的话，取消下面这行注释
      # insecure: true
      tags:
        - ${CI_COMMIT_TAG}
        - latest
    # 这里必须再收一道 when：顶层已经限定 [manual, tag]，但 manual 触发时
    # ${CI_COMMIT_TAG} 是空的，会生成一个空标签让插件直接报错。
    when:
      - event: tag

# ===========================================================================
# 待填清单
# ===========================================================================
#
# 1. 上面 docker-push 里两处 REGISTRY_HOST，换成那台镜像机器的地址。
#
# 2. Woodpecker 仓库设置 → 秘密（Secrets），添加两条：
#        registry_username   登录 registry 的用户名
#        registry_password   密码或 access token
#    「事件」那栏只勾 tag。别勾 pull_request —— 勾了之后任何人开个 PR、
#    在这个文件里加一行 echo，就能把密码打印进公开日志。
#
# ===========================================================================
# 架构：最容易踩的一条
# ===========================================================================
#
# 当前 agent 是 MacBook（linux/arm64），构建产物是 arm64 镜像。
# 接收镜像的机器如果是普通 x86 服务器，拉下去会直接 exec format error。
#
# 在那台机器上跑 uname -m 确认：
#     aarch64 / arm64  → 架构一致，不用管
#     x86_64           → 不一致，三个办法：
#         a. 在那台 x86 机器上也跑一个 woodpecker-agent，让它去构建。
#            最实在，顺带解决 MacBook 休眠导致流水线中断的问题。
#         b. settings 里加 platforms: linux/amd64，靠 QEMU 模拟。
#            就是之前十几分钟跑不完的元凶，除非能接受这个速度。
#         c. platforms: linux/amd64,linux/arm64 出多架构镜像，
#            耗时是 b 再翻倍，但一次覆盖所有目标机器。
#
# ===========================================================================
# 依赖缓存（等镜像拉取问题解决后再加）
# ===========================================================================
#
# 插件每次起的是干净的 docker daemon，layer 缓存一次都命不中，
# Dockerfile 两个阶段的 yarn install 每次从零下载。解法是挂宿主机目录，
# 两个 step 都要加：
#
#     volumes:
#       - /var/lib/woodpecker-cache/vue-cropperjs/buildx:/cache
#     settings:
#       cache_from: type=local,src=/cache
#       cache_to: type=local,dest=/cache,mode=max
#
# 仓库设置里「值得信赖 → 卷」已经打开了，加回来就能生效。
